name: Deploy to GitHub Pages

# One workflow, one gate. Dependabot's auto-merge used to live in test.yml,
# whose `test` (Node 20/22 matrix: typecheck, Vitest, build, npm audit) and
# `a11y` jobs did not run the full Playwright suite (`test:a11y`) that
# this file's build job runs before deploying -- while this file ran none of
# test.yml's checks. A bump could clear one gate, merge itself, and then fail
# the other on main where no pull request is watching. All three gate jobs now
# live in this file, and `deploy` and `dependabot-auto-merge` both need all
# three. test.yml is deleted: its coverage is consolidated below.
on:
  push:
    branches: [main]
  # The gate has to judge pull requests too, or auto-merge has nothing to wait on.
  pull_request:
    branches: [main]
  # Needed because a merge made with GITHUB_TOKEN raises no push event -- GitHub
  # suppresses them so workflows cannot retrigger themselves. Without this the
  # dependabot auto-merge lands a bump on main and the live site never rebuilds,
  # and a human cannot re-deploy by hand either.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by ref, NOT a bare `pages`: now that pull_request is a trigger, a PR
  # run must not share a group with a live main deploy.
  group: pages-${{ github.ref }}
  # Superseded PR runs waste minutes and report stale results. Main deploys are
  # never cancelled, so a newer push cannot strand an in-flight publication.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (fail on high+)
        run: npm audit --audit-level=high

  a11y:
    name: axe-core a11y audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # Use only the Playwright and axe versions pinned in package-lock.json.
      # This avoids runtime `npx --yes` installs and Chrome/ChromeDriver drift.
      - name: Install pinned Playwright browser
        run: npx playwright install chromium

      - name: Run the focused axe accessibility gate
        run: npx playwright test e2e/a11y.spec.ts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y
      - name: Verify built security contact
        run: cmp public/.well-known/security.txt dist/.well-known/security.txt

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist
          # Only the built public directory is uploaded. v5 otherwise drops
          # .well-known/security.txt even when Vite copied it successfully.
          include-hidden-files: true

  configure-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, a11y, build]
    permissions:
      pages: write
      id-token: write
    steps:
      # This privileged job never checks out or executes repository code.
      - uses: actions/configure-pages@v5

  deploy:
    # A pull request is gated, never published. NOT `== 'push'`: that would
    # also skip workflow_dispatch, which the post-merge dispatch depends on.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [configure-pages]
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  verify-deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify published security contact
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          curl --fail --show-error --silent --location \
            --retry 10 --retry-delay 5 --retry-all-errors --max-time 15 \
            "${PAGES_URL%/}/.well-known/security.txt" \
            --output "$RUNNER_TEMP/psi-security.txt"
          cmp public/.well-known/security.txt "$RUNNER_TEMP/psi-security.txt"

  # Dependabot only. `needs: [test, a11y, build]` is the whole safety argument -- a bump can
  # merge itself only once this lab's entire PR gate went green. Major updates
  # always stay open for human review, even if their gate is green.
  dependabot-auto-merge:
    needs: [test, a11y, build]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required by the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Leave major updates for human review
        if: endsWith(steps.meta.outputs.update-type, 'semver-major')
        run: echo "Major update detected; automatic merge is intentionally disabled."

      - name: Merge a non-major bump whose gate went green
        if: ${{ !endsWith(steps.meta.outputs.update-type, 'semver-major') }}
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::error::gate passed but the merge did not land after 3 attempts"
            exit 1
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
