name: Deploy to GitHub Pages

# One workflow, one gate. Dependabot's auto-merge used to live in test.yml,
# whose `test` (Node 20/22 matrix: typecheck, Vitest, build, npm audit) and
# `a11y` (axe-core CLI) jobs did not run the Playwright suite (`test:a11y`) that
# this file's build job runs before deploying -- while this file ran none of
# test.yml's checks. A bump could clear one gate, merge itself, and then fail
# the other on main where no pull request is watching. All three gate jobs now
# live in this file, and `deploy` and `dependabot-auto-merge` both need all
# three. test.yml is deleted: every job it ran is below, unchanged.
on:
  push:
    branches: [main]
  # The gate has to judge pull requests too, or auto-merge has nothing to wait on.
  pull_request:
    branches: [main]
  # Needed because a merge made with GITHUB_TOKEN raises no push event -- GitHub
  # suppresses them so workflows cannot retrigger themselves. Without this the
  # dependabot auto-merge lands a bump on main and the live site never rebuilds,
  # and a human cannot re-deploy by hand either.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref, NOT a bare `pages`: now that pull_request is a trigger, a PR
  # run must not share a group with a live main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (fail on high+)
        run: npm audit --audit-level=high

  a11y:
    name: axe-core a11y audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Build production bundle
        run: npm run build

      # @axe-core/cli depends on `chromedriver: latest`, so `npx` pulls whichever
      # driver matches the newest Chrome release, while the runner image carries
      # whatever Chrome was stable when the image was built. The moment the driver
      # runs ahead of the browser the session never opens ("This version of
      # ChromeDriver only supports Chrome version 152 / Current browser version is
      # 151..."), and axe exits 2 without auditing anything. Resolve a driver that
      # matches the Chrome actually installed here and hand axe that binary.
      - name: Resolve a ChromeDriver matching this runner's Chrome
        id: chromedriver
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || echo /opt/google/chrome/chrome)"
          CHROME_VERSION="$("$CHROME_BIN" --version)"
          CHROME_MAJOR="$(printf '%s' "$CHROME_VERSION" | grep -oE '[0-9]+' | head -1)"
          echo "Chrome: $CHROME_VERSION (major $CHROME_MAJOR)"
          # The runner image ships a Chrome/ChromeDriver pair built together and
          # points CHROMEWEBDRIVER at it; prefer that, and only download a driver
          # when it is absent or has drifted off the browser's major.
          DRIVER=""
          if [ -x "${CHROMEWEBDRIVER:-}/chromedriver" ]; then
            CANDIDATE="$CHROMEWEBDRIVER/chromedriver"
            CANDIDATE_MAJOR="$("$CANDIDATE" --version | grep -oE '[0-9]+' | head -1)"
            if [ "$CANDIDATE_MAJOR" = "$CHROME_MAJOR" ]; then
              DRIVER="$CANDIDATE"
            else
              echo "Pre-installed driver is major $CANDIDATE_MAJOR, browser is $CHROME_MAJOR; fetching a match."
            fi
          fi
          if [ -z "$DRIVER" ]; then
            npm install --no-save --no-package-lock "chromedriver@^${CHROME_MAJOR}.0.0"
            DRIVER="$(node -p "require('chromedriver').path")"
          fi
          echo "ChromeDriver: $("$DRIVER" --version) at $DRIVER"
          echo "path=$DRIVER" >> "$GITHUB_OUTPUT"

      - name: Serve dist and run axe
        run: |
          npx --yes serve dist -p 4707 -s -L &
          SERVE_PID=$!
          npx --yes wait-on -t 30000 http://localhost:4707
          # WCAG 2.1 A + AA; --exit makes any violation fail the job.
          npx --yes @axe-core/cli http://localhost:4707 \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --chromedriver-path "${{ steps.chromedriver.outputs.path }}" \
            --exit
          kill $SERVE_PID

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y
      - name: Verify built security contact
        run: cmp public/.well-known/security.txt dist/.well-known/security.txt

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Only the built public directory is uploaded. v5 otherwise drops
          # .well-known/security.txt even when Vite copied it successfully.
          include-hidden-files: true

  deploy:
    # A pull request is gated, never published. NOT `== 'push'`: that would
    # also skip workflow_dispatch, which the post-merge dispatch depends on.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test, a11y, build]
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify published security contact
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --show-error --silent --location \
            --retry 10 --retry-delay 5 --retry-all-errors --max-time 15 \
            "${PAGES_URL%/}/.well-known/security.txt" \
            --output "$RUNNER_TEMP/psi-security.txt"
          cmp public/.well-known/security.txt "$RUNNER_TEMP/psi-security.txt"

  # Dependabot only. `needs: [test, a11y, build]` is the whole safety argument -- a bump can
  # merge itself only once this lab's entire PR gate went green, so the gate
  # decides rather than the version number. A major that actually breaks the
  # lab fails the gate and the PR stays open for a human.
  dependabot-auto-merge:
    needs: [test, a11y, build]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required by the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
