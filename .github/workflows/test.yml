name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (fail on high+)
        run: npm audit --audit-level=high

  a11y:
    name: axe-core a11y audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Build production bundle
        run: npm run build

      # @axe-core/cli depends on `chromedriver: latest`, so `npx` pulls whichever
      # driver matches the newest Chrome release, while the runner image carries
      # whatever Chrome was stable when the image was built. The moment the driver
      # runs ahead of the browser the session never opens ("This version of
      # ChromeDriver only supports Chrome version 152 / Current browser version is
      # 151..."), and axe exits 2 without auditing anything. Resolve a driver that
      # matches the Chrome actually installed here and hand axe that binary.
      - name: Resolve a ChromeDriver matching this runner's Chrome
        id: chromedriver
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || echo /opt/google/chrome/chrome)"
          CHROME_VERSION="$("$CHROME_BIN" --version)"
          CHROME_MAJOR="$(printf '%s' "$CHROME_VERSION" | grep -oE '[0-9]+' | head -1)"
          echo "Chrome: $CHROME_VERSION (major $CHROME_MAJOR)"
          # The runner image ships a Chrome/ChromeDriver pair built together and
          # points CHROMEWEBDRIVER at it; prefer that, and only download a driver
          # when it is absent or has drifted off the browser's major.
          DRIVER=""
          if [ -x "${CHROMEWEBDRIVER:-}/chromedriver" ]; then
            CANDIDATE="$CHROMEWEBDRIVER/chromedriver"
            CANDIDATE_MAJOR="$("$CANDIDATE" --version | grep -oE '[0-9]+' | head -1)"
            if [ "$CANDIDATE_MAJOR" = "$CHROME_MAJOR" ]; then
              DRIVER="$CANDIDATE"
            else
              echo "Pre-installed driver is major $CANDIDATE_MAJOR, browser is $CHROME_MAJOR; fetching a match."
            fi
          fi
          if [ -z "$DRIVER" ]; then
            npm install --no-save --no-package-lock "chromedriver@^${CHROME_MAJOR}.0.0"
            DRIVER="$(node -p "require('chromedriver').path")"
          fi
          echo "ChromeDriver: $("$DRIVER" --version) at $DRIVER"
          echo "path=$DRIVER" >> "$GITHUB_OUTPUT"

      - name: Serve dist and run axe
        run: |
          npx --yes serve dist -p 4707 -s -L &
          SERVE_PID=$!
          npx --yes wait-on -t 30000 http://localhost:4707
          # WCAG 2.1 A + AA; --exit makes any violation fail the job.
          npx --yes @axe-core/cli http://localhost:4707 \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --chromedriver-path "${{ steps.chromedriver.outputs.path }}" \
            --exit
          kill $SERVE_PID

  # Dependabot only. Depends on every gate job in this workflow, so a bump can
  # only merge itself once this lab's whole PR gate went green. Majors are
  # excluded -- the 2026-08-18 batch had to hold back 109 bumps and they were
  # overwhelmingly majors (@noble v2 dropped export subpaths, TypeScript 7,
  # vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: [test, a11y]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Merge minor and patch bumps
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
