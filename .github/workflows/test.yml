name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (fail on high+)
        run: npm audit --audit-level=high

  a11y:
    name: axe-core a11y audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Serve dist and run axe
        run: |
          npx --yes serve dist -p 4707 -s -L &
          SERVE_PID=$!
          npx --yes wait-on -t 30000 http://localhost:4707
          # WCAG 2.1 A + AA; --exit makes any violation fail the job.
          npx --yes @axe-core/cli http://localhost:4707 \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --exit
          kill $SERVE_PID
