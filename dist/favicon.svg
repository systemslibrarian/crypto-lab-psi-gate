<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PSI Gate">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0a0a0f"/>
  <!-- two overlapping circles whose intersection is highlighted -->
  <circle cx="24" cy="32" r="14" fill="none" stroke="#00d4ff" stroke-width="3"/>
  <circle cx="40" cy="32" r="14" fill="none" stroke="#ff00aa" stroke-width="3"/>
  <!-- the intersection lens -->
  <path d="M32 18 a14 14 0 0 1 0 28 a14 14 0 0 1 0 -28 z" fill="url(#g)" opacity="0.85"/>
  <!-- ∩ glyph anchored bottom-right -->
  <text x="32" y="58" text-anchor="middle" font-family="ui-monospace, monospace"
        font-size="12" font-weight="700" fill="#e0e0ff">A∩B</text>
</svg>
